<style>
:root{

  --ok:#1C7C47; --ok-soft:#DCF2E5; --warn:#A35E00; --warn-soft:#FCEBCF; --bad:#B42318; --bad-soft:#FCE3E0; --info:#2C53C4; --info-soft:#E2E8FB;
  --f:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:16px; --sh:0 1px 2px rgb(15 33 51/.06),0 4px 14px rgb(15 33 51/.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body.bare{padding-bottom:24px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-size:16px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;opacity:.7;line-height:1.2}
.hbtn{border:0;background:rgb(255 255 255/.1);color:#fff;font:600 13px var(--f);height:36px;min-width:36px;padding:0 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.hbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:23px;line-height:1.3;margin:0}
h2{font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,#0B5F66);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.hero .big{font-size:34px;font-weight:700;line-height:1.15}
.hero .sub{opacity:.75;font-size:14px}
.hero .minis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.hero .minis div{background:rgb(255 255 255/.1);border-radius:12px;padding:8px 10px}
.hero .minis span{display:block;font-size:12px;opacity:.75}
.hero .minis b{font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font-size:21px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;background:var(--surface);box-shadow:var(--sh);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;cursor:pointer;color:var(--fg);font:600 15px var(--f);min-height:96px}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:22px;height:22px}
.tile small{font-weight:400;color:var(--muted);font-size:13px;line-height:1.35}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:start;color:inherit;font:inherit;cursor:pointer;min-width:0}
.item:first-child{border-top:0;padding-top:2px}
.item.static{cursor:default}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);flex:none;width:20px;height:20px}
.avatar svg{width:22px;height:22px}
.back svg,.btn svg{flex:none}
[dir=rtl] .chev,[dir=rtl] .flip{transform:scaleX(-1)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:17px}
.avatar.lg{width:56px;height:56px;font-size:22px}
.datebox{width:48px;flex:none;text-align:center;border-radius:12px;background:var(--sunk);padding:5px 0;line-height:1.15}
.datebox b{display:block;font-size:18px}
.datebox span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.s-new{background:var(--sunk);color:var(--muted)}
.s-interested{background:var(--info-soft);color:var(--info)}
.s-offer{background:var(--warn-soft);color:var(--warn)}
.s-won{background:var(--ok-soft);color:var(--ok)}
.s-lost{background:var(--bad-soft);color:var(--bad)}
.st-idea{background:var(--sunk);color:var(--muted)}
.st-offer{background:var(--warn-soft);color:var(--warn)}
.st-progress{background:var(--info-soft);color:var(--info)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--f);padding:10px 16px;border-radius:12px;cursor:pointer;text-decoration:none;min-height:46px}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.6}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.acts .btn{flex-direction:column;gap:4px;font-size:13px;padding:10px 6px;min-height:64px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stages button{border:1px solid var(--line);background:var(--surface);font:600 12.5px var(--f);color:var(--muted);border-radius:12px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.stages button i{font-style:normal;font-size:18px}
.stages button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
input,select,textarea{width:100%;font:16px var(--f);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{min-height:84px;resize:vertical}
input[type=search]{background:var(--surface);box-shadow:var(--sh);border-color:transparent}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:500;min-width:0}
label.f b{color:var(--bad);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--fg);background:var(--surface)}
.checks input{width:auto;min-height:0;margin:0}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.task{display:flex;align-items:center;gap:10px;padding:6px 0}
.task input{width:22px;height:22px;min-height:0;flex:none}
.task.done span{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:15px}
.note{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:15px}
.note.warn{background:var(--warn-soft)}
.note.ok{background:var(--ok-soft)}
.note.bad{background:var(--bad-soft)}
.log{display:flex;flex-direction:column;gap:8px}
.log div{border-inline-start:3px solid var(--accent-soft);padding-inline-start:10px;font-size:15px}
.log small{display:block;color:var(--muted);font-size:12.5px}
details.faq{border-top:1px solid var(--line);padding:10px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details.faq[open] summary::after{content:"−"}
details.faq p{margin-top:6px;color:var(--muted)}
ol.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
nav.tabs{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -6px 20px rgb(15 33 51/.06);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs button{position:relative;border:0;background:none;color:var(--muted);font:600 11.5px var(--f);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button.plus span.c{width:56px;height:56px;margin-top:-22px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgb(10 138 135/.4)}
nav.tabs button.plus svg{width:28px;height:28px}
.badge{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgb(15 33 51/.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:94%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet form{display:flex;flex-direction:column;gap:12px}
.sheet .foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 4px;display:flex;gap:8px}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;max-width:90%;box-shadow:var(--sh);text-align:center}
.back{border:0;background:none;color:var(--accent);font:600 15px var(--f);cursor:pointer;padding:4px 0;align-self:flex-start;display:inline-flex;align-items:center;gap:4px}
.back svg{width:18px;height:18px}
.center{max-width:440px;width:100%;align-self:center}
.logo-big{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin:10px 0 4px}
.intro{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
.intro .in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.intro .dots{display:flex;gap:6px;justify-content:center}
.intro .dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.intro .dots i.on{width:22px;background:var(--accent)}
.intro .pic{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--navy),#0B5F66);color:#fff;display:grid;place-items:center;font-size:46px;align-self:center;margin-top:8px}
.intro h1{text-align:center}
.intro ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.intro li{background:var(--surface);border-radius:14px;box-shadow:var(--sh);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.intro li b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px}
.intro .navb{margin-top:auto;display:flex;gap:8px}
.mock{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;font-weight:600;white-space:nowrap}
.mock.light{background:var(--sunk);color:var(--fg)}
.pw{position:relative}
.pw button{position:absolute;inset-block:0;inset-inline-end:4px;border:0;background:none;color:var(--accent);font:600 13px var(--f);cursor:pointer;padding:0 8px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}.intro .in{animation:fd .25s ease-out}@keyframes fd{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

function renewals(){
  const out=[];

    if(p.domain){const n=daysUntil(p.domain);if(n<=30)out.push({p,kind:"domain",date:p.domain,n})}
  }

const REF_BONUS=100;
function monthPrefix(){const n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)}
function workerStats(uid){
  const ps=S.projects.filter(p=>p.finder?.kind==="member"&&p.finder.id===uid);
  const ym=monthPrefix();let sales=0,comm=0,monthComm=0;
  for(const p of ps){const pct=(+p.finder.pct||0)/100;for(const x of p.payments||[]){const a=+x.amount||0;sales+=a;comm+=a*pct;if(String(x.date).startsWith(ym))monthComm+=a*pct}}
  const recruits=Object.values(S.members).filter(m=>m.recruitedBy===uid&&m.status!=="rejected");
  const hasPaid=id=>S.projects.some(p=>p.finder?.kind==="member"&&p.finder.id===id&&paidOf(p)>0);
  const bonus=recruits.filter(r=>hasPaid(r.id)).length*REF_BONUS;
  const out=S.payouts.filter(x=>x.key==="m:"+uid).reduce((a,x)=>a+(+x.amount||0),0);
  return {uid,ps,sales,comm,monthComm,bonus,recruits,hasPaid,out,earned:comm+bonus,open:comm+bonus-out,
    expected:ps.reduce((a,p)=>a+Math.max((+p.price||0)-paidOf(p),0)*(+p.finder.pct||0)/100,0)};
}

function renderIntro(){
  const el=document.getElementById("intro");
  if(S.intro==null){el.hidden=true;el.innerHTML="";return}
  const steps=INTRO[S.lang];const i=Math.min(S.intro,steps.length-1);const s=steps[i];const last=i===steps.length-1;
  el.hidden=false;
  el.innerHTML=`<div class="in" dir="${S.lang==="ar"?"rtl":"ltr"}"><div class="row between"><span class="small muted">${t("introStep",{a:i+1,b:steps.length})}</span>${last?"":`<button class="back" data-act="introClose">${t("introSkip")}</button>`}</div>
  <div class="dots">${steps.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
  <div class="pic">${s.ic}</div><h1>${s.t}</h1>
  <ul>${s.b.map((x,k)=>`<li><b class="n num">${k+1}</b><span>${x}</span></li>`).join("")}</ul>
  <div class="navb">${i>0?`<button class="btn" data-act="introPrev">${t("introBack")}</button>`:""}<button class="btn primary" style="flex:1" data-act="${last?"introClose":"introNext"}">${last?t("introDone"):t("introNext")}</button></div></div>`;

function render(){
  renderChrome();const m=document.getElementById("main");
  const ae=document.activeElement,focusId=ae&&m.contains(ae)?ae.id:null,selStart=ae?.selectionStart;
  if(S.status==="loading"){m.innerHTML=`<div class="empty" style="margin-top:20vh">${t("loading")}</div>`;return}
  if(S.status==="login"){m.innerHTML=vLogin();return}
  if(S.status==="signup"){m.innerHTML=vSignup();return}
  if(S.status==="pending"){m.innerHTML=vPending();return}

  if(v?.type==="client")m.innerHTML=vClient(v.id);

let armed=null;
function confirmTwice(btn){if(armed===btn)return true;if(armed){armed.classList.remove("armed");armed.textContent=armed.dataset.orig}armed=btn;btn.dataset.orig=btn.textContent;btn.classList.add("armed");btn.textContent=t("sure");setTimeout(()=>{if(armed===btn){btn.classList.remove("armed");btn.textContent=btn.dataset.orig;armed=null}},3500);return false}
const proj=id=>S.projects.find(x=>x.id===id);
function go(tab){S.tab=tab;S.view=null;closeSheet();render();scrollTo(0,0)}
function openView(v){closeSheet();S.view=v;render();scrollTo(0,0)}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.type==="checkbox"||b.type==="radio")return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
   case"langToggle":S.lang=S.lang==="ar"?"de":"ar";try{localStorage.setItem("dts-lang",S.lang)}catch(e){}render();if(S.intro!=null)renderIntro();break;
   case"tab":go(b.dataset.v);break;
   case"back":if(S.view){S.view=null;render()}else go(S.owner&&["check","invite","settings","appts","sales"].includes(S.tab)?"more":(["check","invite"].includes(S.tab)?"home":"more"));scrollTo(0,0);break;
   case"openClient":openView({type:"client",id});break;
   case"openProject":openView({type:"project",id});break;
   case"openWorker":openView({type:"worker",id});break;
   case"pf":S.pFilter=b.dataset.v;render();break;
   case"cf":S.cFilter=b.dataset.v;render();break;
   case"togglePast":S.showPast=!S.showPast;render();break;
   case"add":if(S.owner)chooseAdd();else formClient();break;
   case"newClient":closeSheet();formClient();break;
   case"newClientFrom":formClient(null,{business:S.cq.trim()});break;
   case"newAppt":closeSheet();formAppt(null,b.dataset.client);break;
   case"newProject":closeSheet();formProject(null,b.dataset.client);break;
   case"editClient":formClient(clientOf(id));break;
   case"editProject":formProject(proj(id));break;
   case"editAppt":formAppt(S.appts.find(x=>x.id===id));break;
   case"editMe":formMe();break;
   case"addPayment":formPayment(proj(id));break;
   case"payout":formPayout(b.dataset.key,b.dataset.name,b.dataset.amt);break;
   case"closeSheet":closeSheet();break;
   case"addMember":formMember();break;
   case"editWorker":formEditMember(S.members[id]);break;
   case"intro":openIntro();break;
   case"introNext":S.intro++;renderIntro();break;
   case"introPrev":S.intro=Math.max(0,S.intro-1);renderIntro();break;
   case"introClose":closeIntro();break;
   case"copy":copyText(b.dataset.v);break;
   case"pwToggle":{const inp=document.getElementById(b.dataset.for);if(inp){const show=inp.type==="password";inp.type=show?"text":"password";b.textContent=show?t("hide"):t("show")}break}
   case"goSignup":S.status="signup";location.hash="join";render();scrollTo(0,0);break;
   case"goLogin":S.status="login";history.replaceState(null,"",location.pathname);render();scrollTo(0,0);break;
   case"sendReset":{const m=S.members[id];if(m?.email){try{await auth.sendPasswordResetEmail(m.email);toast(t("resetTo")+" "+m.email)}catch(err){toast(t("err"))}}break}
   case"toggleActive":{const m=S.members[id];if(await write(()=>fdb.doc("users/"+id).update({active:m.active===false,status:m.active===false?"active":"stopped"}),t("saved")))closeSheet();break}
   case"approve":{const m=S.members[id];write(()=>fdb.doc("users/"+id).update({active:true,status:"active",pct:m?.pct??30}),t("approved"));break}
   case"rejectM":if(confirmTwice(b))write(()=>fdb.doc("users/"+id).update({active:false,status:"rejected"}),t("saved"));break;
   case"logout":S.intro=null;renderIntro();auth.signOut();break;
   case"reset":{const em=document.getElementById("l-email")?.value.trim();if(!em){toast(t("needEmail"));document.getElementById("l-email")?.focus();break}try{await auth.sendPasswordResetEmail(em)}catch(err){}toast(t("resetSent"));break}
   case"setStage":{const c=clientOf(id);const v=b.dataset.v;if(!c||stageOf(c)===v)break;
     const upd={stage:v,log:[...(c.log||[]),{id:uidShort(),at:Date.now(),by:S.uid,type:"stage",stage:v}]};if(["won","lost"].includes(v))upd.followUp="";
     write(()=>fdb.doc("clients/"+id).update(upd),t("saved"));break}
   case"follow":{const n=+b.dataset.v;write(()=>fdb.doc("clients/"+id).update({followUp:n?plusDays(n):""}),t("saved"));break}
   case"setStatus":write(()=>fdb.doc("projects/"+id).update({status:b.dataset.v}));break;
   case"subPaid":{const p=proj(id);write(()=>fdb.doc("projects/"+id).update({payments:[...(p.payments||[]),{id:uidShort(),amount:+p.monthly,date:todayIso(),note:t("renewSub")}],nextDue:addMonth(p.nextDue)}),t("saved"));break}
   case"delPayment":if(confirmTwice(b)){const p=proj(id);write(()=>fdb.doc("projects/"+id).update({payments:(p.payments||[]).filter(x=>x.id!==b.dataset.pid)}))}break;
   case"delTask":{const p=proj(id);write(()=>fdb.doc("projects/"+id).update({tasks:(p.tasks||[]).filter(x=>x.id!==b.dataset.tid)}));break}
   case"delPayout":if(confirmTwice(b))write(()=>fdb.doc("payouts/"+id).delete());break;
   case"delClient":if(confirmTwice(b)&&await write(()=>fdb.doc("clients/"+id).delete())){closeSheet();S.view=null;render()}break;
   case"delProject":if(confirmTwice(b)&&await write(()=>fdb.doc("projects/"+id).delete())){closeSheet();S.view=null;render()}break;
   case"delAppt":if(confirmTwice(b)&&await write(()=>fdb.doc("appointments/"+id).delete()))closeSheet();break;
  }
});

document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const fd=new FormData(f);const d=Object.fromEntries(fd.entries());
  const btn=f.querySelector('[type="submit"]');if(btn)btn.disabled=true;
  try{
    if(f.id==="sheetForm"&&sheetSubmit){if(await sheetSubmit(d,fd)!==false){closeSheet();render()}}
    else if(f.dataset.form==="task"){const p=proj(f.dataset.id);const text=(d.text||"").trim();if(text&&await write(()=>fdb.doc("projects/"+p.id).update({tasks:[...(p.tasks||[]),{id:uidShort(),text,done:false}]})))f.reset()}
    else if(f.dataset.form==="note"){const c=clientOf(f.dataset.id);const text=(d.text||"").trim();if(c&&text&&await write(()=>fdb.doc("clients/"+c.id).update({log:[...(c.log||[]),{id:uidShort(),at:Date.now(),by:S.uid,text}]}),t("saved")))f.reset()}
    else if(f.dataset.form==="settings"){
      const examples=d.examples.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf("|");return i>0?{t:l.slice(0,i).trim(),u:l.slice(i+1).trim()}:{t:l,u:l}}).filter(x=>/^https?:\/\//.test(x.u));
      const pitch=d.pitch.split("\n").map(l=>l.trim()).filter(Boolean);
      await write(()=>fdb.doc("settings/app").set({examples,pitch,prices:d.prices.trim(),ownerPhone:d.ownerPhone.trim()},{merge:true}),t("saved"));
    }
    else if(f.dataset.form==="me"&&S.owner){await write(()=>fdb.doc("users/"+S.uid).set({name:d.name.trim(),phone:d.phone.trim(),email:S.email,role:"owner",active:true,status:"active",joinedAt:Date.now()}),t("saved"))}
    else if(f.dataset.form==="login"){try{await auth.signInWithEmailAndPassword(d.email.trim(),d.password)}catch(err){toast(t("badLogin"))}}
    else if(f.dataset.form==="signup")await doSignup(d);
  }finally{if(btn&&btn.isConnected)btn.disabled=false}
});
async function doSignup(d){
  const name=(d.name||"").trim(),phone=(d.phone||"").trim(),email=(d.email||"").trim().toLowerCase();
  if(!name||!phone){toast(t("fullName")+" / "+t("phone")+" ?");return}
  if(!/^\S+@\S+\.\S+$/.test(email)){toast(t("badEmail"));return}
  if(String(d.password||"").length<6){toast(t("weakPw"));return}
  if(!d.consent){toast(t("needConsent"));return}
  S.signingUp={name,phone,email,city:(d.city||"").trim(),experience:d.experience||"",referrerName:(d.referrerName||"").trim(),recruitedBy:S.joinRef||""};
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,d.password);
    await fdb.doc("users/"+cred.user.uid).set({...S.signingUp,role:"member",active:false,status:"pending",joinedAt:Date.now()});
    S.signup={};S.signingUp=null;history.replaceState(null,"",location.pathname);
  }catch(e){
    console.error(e);const c=e?.code||"";S.signingUp=null;
    if(c.includes("email-already")){toast(t("emailUsed"))}
    else if(c.includes("weak-password"))toast(t("weakPw"));
    else if(c.includes("invalid-email"))toast(t("badEmail"));
    else toast(t("err"));
    if(auth.currentUser&&!c.includes("auth/"))await auth.signOut().catch(()=>{});
  }
}

const auth=firebase.auth(),fdb=firebase.firestore();
function readHash(){const h=location.hash.replace(/^#/,"");if(!h.startsWith("join"))return false;const r=h.split("=")[1]||"";S.joinRef=/^[A-Za-z0-9]{10,40}$/.test(r)?r:"";return true}
let unsubs=[],dataOn=false,setUnsub=null;
function stopAll(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];dataOn=false;if(setUnsub){try{setUnsub()}catch(e){}setUnsub=null}}
function watchSettings(){if(setUnsub)return;setUnsub=fdb.doc("settings/app").onSnapshot(s=>{S.settings=s.exists?s.data():null;if(["ready","pending","inactive"].includes(S.status))render()},()=>{S.settings=null})}
function startData(){
  if(dataOn)return;dataOn=true;
  const need=["users","clients","projects","appointments","payouts"];
  const done=()=>{if(need.every(n=>S.loaded[n])&&S.status==="loading")S.status="ready";if(S.status==="ready"){render();maybeIntro()}};
  const sub=(name,fn)=>unsubs.push(fdb.collection(name).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));S.loaded[name]=true;done()},err=>{console.error(name,err);S.loaded[name]=true;done()}));
  sub("users",l=>{S.members={};l.forEach(m=>S.members[m.id]=m)});
  sub("clients",l=>S.clients=l);
  sub("projects",l=>S.projects=l);
  sub("appointments",l=>S.appts=l);
  sub("payouts",l=>S.payouts=l);
  if(S.owner){
    need.push("staffNotes");sub("staffNotes",l=>{S.notes={};l.forEach(n=>S.notes[n.id]=n.text||"")});
    unsubs.push(fdb.collection("private").onSnapshot(s=>{S.priv={};s.docs.forEach(d=>S.priv[d.id]=d.data());S.myPriv=S.priv[S.uid]||{};if(S.status==="ready")render()},()=>{}));
  }else{
    unsubs.push(fdb.doc("private/"+S.uid).onSnapshot(s=>{S.myPriv=s.exists?s.data():{};if(S.status==="ready")render()},()=>{}));
  }
}
let introAuto=false;
function maybeIntro(){
  if(introAuto||S.owner||S.intro!=null)return;
  const me=S.members[S.uid];if(!me)return;introAuto=true;
  if(!me.onboarded&&!introSeenLocal())openIntro();
}
window.addEventListener("hashchange",()=>{if(S.status==="login"&&readHash()){S.status="signup";render()}});
readHash();
render();
auth.onAuthStateChanged(u=>{
  stopAll();closeSheet();introAuto=false;
  Object.assign(S,{members:{},clients:[],projects:[],appts:[],payouts:[],notes:{},priv:{},myPriv:{},loaded:{},view:null,tab:"home",me:null,q:"",cq:""});
  if(!u){S.uid=null;S.owner=false;S.status=readHash()?"signup":"login";render();return}
  S.uid=u.uid;S.email=(u.email||"").toLowerCase();S.owner=S.email===ADMIN_EMAIL;S.status="loading";render();
  watchSettings();
  const meUnsub=fdb.doc("users/"+u.uid).onSnapshot(s=>{
    const me=s.exists?s.data():null;S.me=me;
    if(!me){stopData();S.status=S.owner?"join":(S.signingUp?"loading":"inactive");render();return}
    if(!S.owner&&me.active===false){stopData();S.status=me.status==="pending"?"pending":"inactive";render();return}
    if(S.status!=="ready")S.status="loading";
    if(location.hash.startsWith("#join"))history.replaceState(null,"",location.pathname);
    startData();render();
  },err=>{console.error(err);S.status="inactive";render()});
  function stopData(){const keep=meUnsub;unsubs.forEach(f=>{if(f!==keep)try{f()}catch(e){}});unsubs=[keep];dataOn=false;S.loaded={}}
  unsubs.push(meUnsub);
});
